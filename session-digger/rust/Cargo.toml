[package]
name = "session-digger"
version = "0.1.0"
edition = "2021"
description = "droidcon Kenya link digger built on the Rivium app runtime"

[features]
default = []
# Desktop-only queue inspector UI (apalis-board), opt-in so the default
# `cargo run --bin digd` build and the Android cdylib stay lean.
board = ["dep:apalis-board", "dep:axum"]

[dependencies]
rivium = { version = "0.2.0", features = ["full"] }
apalis = { version = "1.0.0", features = ["retry", "limit"] }
apalis-core = { version = "1.0.0", features = ["task-context"] }
apalis-sqlite = "1.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
futures = "0.3"

[target.'cfg(not(target_os = "android"))'.dependencies]
rivium-host = { version = "0.2.0", features = ["process"] }
# Optional, desktop-only: the apalis-board queue inspector (web UI + API).
# `ui` serves the prebuilt frontend via include_dir; no wasm build needed.
apalis-board = { version = "1.0.0", features = ["axum", "ui"], optional = true }
axum = { version = "0.8", features = ["json", "tokio", "query"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
rivium-jni = "0.2.0"
rivium-host = { version = "0.2.0", features = ["embedded"] }

[lib]
name = "session_digger"
path = "src/lib.rs"
# rlib: linked by digd and the laptop e2e tests on desktop.
# cdylib: packaged as libsession_digger.so for the Android JNI host.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "digd"
path = "src/bin/digd.rs"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = true
# rivium-jni rejects panic=abort; keep unwind explicitly for Android FFI safety
panic = "unwind"
